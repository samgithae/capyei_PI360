[project]
name = "pi360-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dj-database-url>=3.1.2",
    "django>=5.2,<6",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.0",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]

[tool.importlinter]
root_packages = ["apps", "config", "pi360_rules"]
include_external_packages = true

# Generated from doc 04 §4.1 "Depends on". Each module may import only the
# modules listed there, plus apps.api (shared API conventions).

[[tool.importlinter.contracts]]
name = "CMP-02 API conventions import no domain module"
type = "forbidden"
source_modules = ["apps.api"]
forbidden_modules = ["apps.identity", "apps.participants", "apps.employers", "apps.referrals", "apps.placements", "apps.intelligence", "apps.imports", "apps.dataquality", "apps.reporting", "apps.audit", "apps.configuration", "apps.platform", "config"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "CMP-03 Identity & access imports only its documented dependencies"
type = "forbidden"
source_modules = ["apps.identity"]
forbidden_modules = ["apps.participants", "apps.employers", "apps.referrals", "apps.placements", "apps.intelligence", "apps.imports", "apps.dataquality", "apps.reporting", "apps.configuration", "apps.platform", "config"]
