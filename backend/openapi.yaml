components:
  schemas:
    ActionEnum:
      enum:
      - link
      - create
      - apart
      type: string
      description: |-
        * `link` - link
        * `create` - create
        * `apart` - apart
    Activate:
      type: object
      properties:
        token:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 128
      required:
      - password
      - token
    Alias:
      type: object
      properties:
        alias:
          type: string
        source:
          type: string
          default: ''
        scope:
          type: string
          default: ''
      required:
      - alias
    Approve:
      type: object
      properties:
        create_reference:
          type: boolean
          default: false
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type: integer
          readOnly: true
          nullable: true
        actor_label:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        before:
          readOnly: true
          nullable: true
        after:
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
        hash:
          type: string
          readOnly: true
      required:
      - action
      - actor_id
      - actor_label
      - after
      - at
      - before
      - hash
      - id
      - ip
      - object_id
      - object_type
      - reason
      - request_id
    BlankEnum:
      enum:
      - ''
    Bulk:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 1
        reason:
          type: string
          default: ''
          maxLength: 300
      required:
      - ids
    ClusterDecision:
      type: object
      properties:
        key:
          type: string
          maxLength: 200
        spellings:
          type: array
          items:
            type: string
            maxLength: 300
          minItems: 1
        action:
          $ref: '#/components/schemas/ActionEnum'
        employer_id:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - key
      - spellings
    CohortCoursesBulk:
      type: object
      properties:
        cohort:
          type: string
          format: uuid
        courses:
          type: array
          items:
            type: string
            format: uuid
      required:
      - cohort
      - courses
    Consent:
      type: object
      properties:
        version:
          type: string
          maxLength: 20
      required:
      - version
    Contact:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        role:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 200
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 50
        is_primary:
          type: boolean
          default: false
      required:
      - name
    ContactKindEnum:
      enum:
      - phone
      - email
      type: string
      description: |-
        * `phone` - phone
        * `email` - email
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Decline:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    DuplicateReason:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    Employer:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        sector_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        county_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        sub_county:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 200
        website:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/EmployerStatusEnum'
        notes:
          type: string
        confirm_duplicate:
          type: boolean
          default: false
      required:
      - name
    EmployerActivate:
      type: object
      properties:
        token:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 128
      required:
      - password
      - token
    EmployerInvite:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 150
        job_title:
          type: string
          maxLength: 100
        role_id:
          type: integer
        contact_id:
          type: string
          format: uuid
        phone:
          type: string
          maxLength: 50
        is_primary:
          type: boolean
      required:
      - email
      - full_name
      - role_id
    EmployerStatusEnum:
      enum:
      - active
      - inactive
      - prospect
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
