openapi: 3.0.3
info:
  title: PI 360 API
  version: 0.1.0
paths:
  /api/v1/audit/events:
    get:
      operationId: audit_events_list
      description: 'Audit events, newest first. Read-only: there is no way to write
        through the API.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_id
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: request_id
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/confirm:
    post:
      operationId: auth_mfa_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaCode'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/mfa/setup:
    post:
      operationId: auth_mfa_setup_create
      description: 'First-time enrolment: returns the otpauth URL to show as a QR
        code.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
          description: ''
  /api/v1/auth/mfa/verify:
    post:
      operationId: auth_mfa_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaCode'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: Liveness and database check for load balancers and the SPA.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: |-
        Who is signed in. Sets the CSRF cookie for the SPA (ADR-023).
        Roles and permissions arrive with the identity module (T-142).
      tags:
      - me
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
components:
  schemas:
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type: integer
          readOnly: true
          nullable: true
        actor_label:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        before:
          readOnly: true
          nullable: true
        after:
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
        hash:
          type: string
          readOnly: true
      required:
      - action
      - actor_id
      - actor_label
      - after
      - at
      - before
      - hash
      - id
      - ip
      - object_id
      - object_type
      - reason
      - request_id
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        version:
          type: string
      required:
      - database
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 256
      required:
      - password
      - username
    LoginResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LoginResultStatusEnum'
        mfa_enrolled:
          type: boolean
      required:
      - status
    LoginResultStatusEnum:
      enum:
      - ok
      - mfa_required
      type: string
      description: |-
        * `ok` - ok
        * `mfa_required` - mfa_required
    Me:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - authenticated
    MfaCode:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
    MfaSetup:
      type: object
      properties:
        config_url:
          type: string
      required:
      - config_url
    PaginatedAuditEventList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          maxLength: 256
        new_password:
          type: string
          maxLength: 256
      required:
      - current_password
      - new_password
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
          maxLength: 256
      required:
      - new_password
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
