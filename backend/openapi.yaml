components:
  schemas:
    ActionEnum:
      enum:
      - link
      - create
      - apart
      type: string
      description: |-
        * `link` - link
        * `create` - create
        * `apart` - apart
    Alias:
      type: object
      properties:
        alias:
          type: string
        source:
          type: string
          default: ''
        scope:
          type: string
          default: ''
      required:
      - alias
    Approve:
      type: object
      properties:
        create_reference:
          type: boolean
          default: false
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type: integer
          readOnly: true
          nullable: true
        actor_label:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        before:
          readOnly: true
          nullable: true
        after:
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
        hash:
          type: string
          readOnly: true
      required:
      - action
      - actor_id
      - actor_label
      - after
      - at
      - before
      - hash
      - id
      - ip
      - object_id
      - object_type
      - reason
      - request_id
    Bulk:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 1
        reason:
          type: string
          default: ''
          maxLength: 300
      required:
      - ids
    ClusterDecision:
      type: object
      properties:
        key:
          type: string
          maxLength: 200
        spellings:
          type: array
          items:
            type: string
            maxLength: 300
          minItems: 1
        action:
          $ref: '#/components/schemas/ActionEnum'
        employer_id:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - key
      - spellings
    Contact:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        role:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 200
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 50
        is_primary:
          type: boolean
          default: false
      required:
      - name
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    DuplicateReason:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    Employer:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        sector_id:
          type: string
          format: uuid
          nullable: true
        county_id:
          type: string
          format: uuid
          nullable: true
        sub_county:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 200
        website:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/EmployerStatusEnum'
        notes:
          type: string
        confirm_duplicate:
          type: boolean
          default: false
      required:
      - name
    EmployerStatusEnum:
      enum:
      - active
      - inactive
      - prospect
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `prospect` - Prospect
    EnrollmentEditStatusEnum:
      enum:
      - enrolled
      - completed
      - withdrawn
      - unknown
      type: string
      description: |-
        * `enrolled` - enrolled
        * `completed` - completed
        * `withdrawn` - withdrawn
        * `unknown` - unknown
    FactorEnum:
      enum:
      - skill
      - qualification
      - location
      - availability
      - other
      type: string
      description: |-
        * `skill` - Skill
        * `qualification` - Qualification
        * `location` - Location
        * `availability` - Availability
        * `other` - Other
    Flag:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        description:
          type: string
        enabled:
          type: boolean
        environments:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        reason:
          type: string
          writeOnly: true
      required:
      - key
    GenderEnum:
      enum:
      - female
      - male
      - other
      - unknown
      type: string
      description: |-
        * `female` - female
        * `male` - male
        * `other` - other
        * `unknown` - unknown
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        version:
          type: string
      required:
      - database
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    Inspect:
      type: object
      properties:
        file:
          type: string
          format: uri
        target:
          allOf:
          - $ref: '#/components/schemas/TargetEnum'
          default: participants
      required:
      - file
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 256
      required:
      - password
      - username
    LoginResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LoginResultStatusEnum'
        mfa_enrolled:
          type: boolean
      required:
      - status
    LoginResultStatusEnum:
      enum:
      - ok
      - mfa_required
      type: string
      description: |-
        * `ok` - ok
        * `mfa_required` - mfa_required
    Me:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          type: object
          additionalProperties: {}
      required:
      - authenticated
    Merge:
      type: object
      properties:
        survivor:
          type: string
          format: uuid
        fields:
          type: object
          additionalProperties:
            type: string
        reason:
          type: string
          maxLength: 500
      required:
      - reason
      - survivor
    MfaCode:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
    MfaSetup:
      type: object
      properties:
        config_url:
          type: string
      required:
      - config_url
    OpportunityCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/OpportunityKindEnum'
        sector_id:
          type: string
          format: uuid
          nullable: true
        county_id:
          type: string
          format: uuid
          nullable: true
        location:
          type: string
          maxLength: 200
        positions:
          type: integer
          maximum: 10000
          minimum: 1
        description:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        closing_date:
          type: string
          format: date
          nullable: true
        employer_id:
          type: string
          format: uuid
      required:
      - employer_id
      - title
    OpportunityKindEnum:
      enum:
      - job
      - internship
      - apprenticeship
      - other
      type: string
      description: |-
        * `job` - Job
        * `internship` - Internship
        * `apprenticeship` - Apprenticeship
        * `other` - Other
    PaginatedAuditEventList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    ParticipantContact:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ParticipantContactKindEnum'
        value:
          type: string
          maxLength: 200
        primary:
          type: boolean
          default: false
      required:
      - kind
      - value
    ParticipantContactKindEnum:
      enum:
      - phone
      - email
      type: string
      description: |-
        * `phone` - phone
        * `email` - email
    ParticipantContacts:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantContact'
      required:
      - contacts
    ParticipantEditStatusEnum:
      enum:
      - active
      - completed
      - withdrawn
      - unknown
      type: string
      description: |-
        * `active` - active
        * `completed` - completed
        * `withdrawn` - withdrawn
        * `unknown` - unknown
    PasswordChange:
      type: object
