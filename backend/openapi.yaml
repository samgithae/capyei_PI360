openapi: 3.0.3
info:
  title: PI 360 API
  version: 0.1.0
paths:
  /api/v1/audit/events:
    get:
      operationId: audit_events_list
      description: 'Audit events, newest first. Read-only: there is no way to write
        through the API.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_id
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: request_id
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
