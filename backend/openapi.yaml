components:
  schemas:
    Alias:
      type: object
      properties:
        alias:
          type: string
        source:
          type: string
          default: ''
        scope:
          type: string
          default: ''
      required:
      - alias
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type: integer
          readOnly: true
          nullable: true
        actor_label:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        before:
          readOnly: true
          nullable: true
        after:
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
        hash:
          type: string
          readOnly: true
      required:
      - action
      - actor_id
      - actor_label
      - after
      - at
      - before
      - hash
      - id
      - ip
      - object_id
      - object_type
      - reason
      - request_id
    DatabaseEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Flag:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        description:
          type: string
        enabled:
          type: boolean
        environments:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        reason:
          type: string
          writeOnly: true
      required:
      - key
    GenderEnum:
      enum:
      - female
      - male
      - other
      - unknown
      type: string
      description: |-
        * `female` - female
        * `male` - male
        * `other` - other
        * `unknown` - unknown
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        version:
          type: string
      required:
      - database
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    KindEnum:
      enum:
      - programme
      - cohort
      - region
      - officer
      type: string
      description: |-
        * `programme` - programme
        * `cohort` - cohort
        * `region` - region
        * `officer` - officer
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 256
      required:
      - password
      - username
    LoginResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LoginResultStatusEnum'
        mfa_enrolled:
          type: boolean
      required:
      - status
    LoginResultStatusEnum:
      enum:
      - ok
      - mfa_required
      type: string
      description: |-
        * `ok` - ok
        * `mfa_required` - mfa_required
    Me:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          type: object
          additionalProperties: {}
      required:
      - authenticated
    MfaCode:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
    MfaSetup:
      type: object
      properties:
        config_url:
          type: string
      required:
      - config_url
    PaginatedAuditEventList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    ParticipantEditStatusEnum:
      enum:
      - active
      - completed
      - withdrawn
      - unknown
      type: string
      description: |-
        * `active` - active
        * `completed` - completed
        * `withdrawn` - withdrawn
        * `unknown` - unknown
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          maxLength: 256
        new_password:
          type: string
          maxLength: 256
      required:
      - current_password
      - new_password
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
          maxLength: 256
      required:
      - new_password
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PatchedFlag:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        description:
          type: string
        enabled:
          type: boolean
        environments:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        reason:
          type: string
          writeOnly: true
    PatchedParticipantEdit:
      type: object
      properties:
        given_name:
          type: string
          maxLength: 100
        family_name:
          type: string
          maxLength: 100
        other_names:
          type: string
          maxLength: 100
        gender:
          $ref: '#/components/schemas/GenderEnum'
        status:
          $ref: '#/components/schemas/ParticipantEditStatusEnum'
    PatchedRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        permissions:
          type: array
          items:
            type: string
        scope_mode:
          $ref: '#/components/schemas/ScopeModeEnum'
        active:
          type: boolean
        is_system:
          type: boolean
          readOnly: true
        user_count:
          type: integer
          readOnly: true
    PatchedUserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    Permission:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        group:
          type: string
        grant_only:
          type: boolean
      required:
      - code
      - grant_only
      - group
      - label
    Reason:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 300
    ReferenceReason:
      type: object
      properties:
        reason:
          type: string
          default: ''
    Role:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        permissions:
          type: array
          items:
            type: string
        scope_mode:
          $ref: '#/components/schemas/ScopeModeEnum'
        active:
          type: boolean
        is_system:
          type: boolean
          readOnly: true
        user_count:
          type: integer
          readOnly: true
      required:
      - id
      - is_system
      - name
      - user_count
    Rollback:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    ScopeItem:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        value:
          type: string
          maxLength: 64
      required:
      - kind
      - value
    ScopeModeEnum:
      enum:
      - all
      - assigned
      type: string
      description: |-
        * `all` - all
        * `assigned` - assigned
    Setting:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: integer
        default:
          type: integer
        min:
          type: integer
        max:
          type: integer
      required:
      - default
      - key
      - label
      - max
      - min
      - value
    SettingChange:
      type: object
      properties:
        key:
          type: string
        value:
          type: integer
        reason:
          type: string
        password:
          type: string
          writeOnly: true
        code:
          type: string
          writeOnly: true
          default: ''
      required:
      - key
      - password
      - reason
      - value
    TemplateInput:
      type: object
      properties:
        source:
          type: string
          maxLength: 60
        columns:
          type: object
          additionalProperties:
            type: string
        target:
          type: string
          default: participants
      required:
      - columns
      - source
    Upload:
      type: object
      properties:
        template:
          type: string
          format: uuid
        file:
          type: string
          format: uri
      required:
      - file
      - template
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          readOnly: true
        mfa_enrolled:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        roles:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        scopes:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - email
      - id
      - is_active
      - last_login
      - mfa_enrolled
      - roles
      - scopes
      - username
    UserCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          readOnly: true
        mfa_enrolled:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        roles:
          type: array
          items:
            type: integer
        scopes:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - email
      - id
      - is_active
      - last_login
      - mfa_enrolled
      - scopes
      - username
    UserRoles:
      type: object
      properties:
        roles:
          type: array
          items:
            type: integer
      required:
      - roles
    UserScopes:
      type: object
      properties:
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeItem'
      required:
      - scopes
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
