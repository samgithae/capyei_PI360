# Local development stack. Synthetic data only: never load real trainee data
# here (SEC-14). Copy .env.example to .env first.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pi360
      POSTGRES_USER: pi360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi360 -d pi360"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://pi360:${POSTGRES_PASSWORD}@postgres:5432/pi360
      TRUST_X_FORWARDED_FOR: "1"  # requests arrive only via the web container's nginx
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    depends_on:
      postgres:
        condition: service_healthy

  # Daily housekeeping (T-045 expiry). One small loop instead of a cron daemon; the job is
  # idempotent, so a restart or a double run is harmless. Add further jobs to the loop.
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://pi360:${POSTGRES_PASSWORD}@postgres:5432/pi360
    command: >
      sh -c "while true; do python manage.py expire_opportunities; sleep 86400; done"
    depends_on:
      - api

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
