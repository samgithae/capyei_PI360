name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pi360
          POSTGRES_USER: pi360
          POSTGRES_PASSWORD: pi360
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pi360" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://pi360:pi360@localhost:5432/pi360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Architecture contracts (doc 04 §4)
        run: uv run lint-imports
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid and committed
        run: |
          uv run python manage.py spectacular --validate --fail-on-warn --file openapi.yaml
          git diff --exit-code -- openapi.yaml || {
            echo "::error::openapi.yaml is out of date. Regenerate it with: uv run python manage.py spectacular --file openapi.yaml, then commit it."
            exit 1
          }
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pi360-api backend
      - run: docker build -t pi360-web frontend
